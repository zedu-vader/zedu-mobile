name: PR Review Bot

on:
  pull_request:
    branches:
      - main
      - central-staging
      - dev
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      # Tier 1: every push in a contributor fork runs the checks.
      - "**"

concurrency:
  group: pr-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-review:
    name: Structure, reuse, URLs, and secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Review with the base branch's rules, not the copy frozen into this PR's test-merge ref.
      # GitHub only refreshes refs/pull/<n>/merge on PR events, so a merged config fix would
      # otherwise keep producing a stale verdict. .github/ is protected, so the base copy is trusted.
      - name: Use the base branch's review rules
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          git checkout FETCH_HEAD -- .github/pr-review.config.json .github/scripts/pr-review

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run PR review
        id: review
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node .github/scripts/pr-review/run.mjs