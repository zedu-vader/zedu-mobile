name: Team APK

# Team VADER test builds. Lives only on the `apk-builder` branch and on throwaway `apk/*` branches;
# never merge it into dev (it would show up in the consolidated PR to zedu-hng).
# To build a PR: branch `apk/pr-<n>` from the PR head, add this file, push. The run uploads an
# installable release APK (arm64) as the `android-apk` artifact.
# Mirrors zedu-ci's pr-build-react-native.yml Android job and its public .env template, against the
# dev backend. GOOGLE_CLIENT_ID is a placeholder so the sign-in screen doesn't throw; Google sign-in,
# push and calls don't work in these builds.

on:
  push:
    branches:
      - "apk/**"

permissions:
  contents: read

concurrency:
  group: team-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Install dependencies
        run: npm ci

      - name: Write .env
        run: |
          cat > .env <<'EOF'
          API_URL=https://api.hng.groups.zedu.chat
          BASE_URL=https://api.hng.groups.zedu.chat/api/v1
          CONNECT_URL=wss://api.hng.groups.zedu.chat/centrifugo/connection/websocket
          CLIENT_URL=https://hng.groups.zedu.chat
          ONESIGNAL_APP_ID=00000000-0000-0000-0000-000000000000
          GOOGLE_CLIENT_ID=placeholder.apps.googleusercontent.com
          EOF

      - name: Assemble release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
