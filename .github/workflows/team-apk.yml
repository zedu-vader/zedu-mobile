name: Team APK

# Team VADER test builds. Lives only on the `apk-builder` branch and on throwaway `apk/*` branches;
# never merge it into dev (it would show up in the consolidated PR to zedu-hng).
# To build a PR: branch `apk/pr-<n>` from the PR head, add this file, push. The run uploads an
# installable release APK (arm64) as the `android-apk` artifact.
# Mirrors zedu-ci's pr-build-react-native.yml Android job and its public .env template, against the
# dev backend. GOOGLE_CLIENT_ID is a placeholder so the sign-in screen doesn't throw; Google sign-in,
# push and calls don't work in these builds. Each PR gets its own app, e.g. branch apk/pr-5 builds
# "Zedu PR5" (net.emerj.zedu.pr5), so it installs next to the Play Store app and other PR builds.

on:
  push:
    branches:
      - "apk/**"

permissions:
  contents: read

concurrency:
  group: team-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Install dependencies
        run: npm ci

      - name: Write .env
        run: |
          cat > .env <<'EOF'
          API_URL=https://api.hng.groups.zedu.chat
          BASE_URL=https://api.hng.groups.zedu.chat/api/v1
          CONNECT_URL=wss://api.hng.groups.zedu.chat/centrifugo/connection/websocket
          CLIENT_URL=https://hng.groups.zedu.chat
          ONESIGNAL_APP_ID=00000000-0000-0000-0000-000000000000
          GOOGLE_CLIENT_ID=placeholder.apps.googleusercontent.com
          EOF

      # Own app ID and name per PR (apk/pr-5 -> "Zedu PR5", net.emerj.zedu.pr5), so the build installs
      # next to the Play Store app and other PR builds. google-services.json must list the same package.
      - name: Make it a separate app for this PR
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          tag="$(echo "${BRANCH#apk/}" | tr -cd 'a-zA-Z0-9' | tr 'A-Z' 'a-z')"
          [[ "$tag" =~ ^[a-z] ]] || tag="b$tag"
          app_id="net.emerj.zedu.$tag"
          app_name="Zedu ${tag^^}"
          echo "Building $app_name ($app_id)"
          sed -i "s/applicationId \"net.emerj.zedu\"/applicationId \"$app_id\"/" android/app/build.gradle
          sed -i "s/\"package_name\": *\"net.emerj.zedu\"/\"package_name\": \"$app_id\"/" android/app/google-services.json
          sed -i "s|<string name=\"app_name\">Zedu</string>|<string name=\"app_name\">$app_name</string>|" android/app/src/main/res/values/strings.xml
          grep -q "applicationId \"$app_id\"" android/app/build.gradle
          grep -q "\"package_name\": \"$app_id\"" android/app/google-services.json
          grep -q "$app_name" android/app/src/main/res/values/strings.xml

      - name: Assemble release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
